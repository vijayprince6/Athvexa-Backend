# Supabase Database Configuration - Using Shared Pooler (IPv4 compatible)
# Added prepareThreshold=0 to disable prepared statement caching (fixes Supabase pooler issue)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=HikariCP-Athvexa
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
# Validate connections are alive before using them
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Explicitly set dialect so Hibernate never needs to auto-detect it via JDBC metadata
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
# Use PORT environment variable from deployment platform, default to 10000 for local dev
server.port=${PORT:10000}
server.address=0.0.0.0

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
logging.level.com.cloudinary=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=https://athvexa-sports-portal.web.app,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.exposed-headers=*
spring.jpa.open-in-view=false

# Gemini AI Configuration
# IMPORTANT: Set GEMINI_API_KEY as a Render environment variable.
# Never hardcode the actual API key here — this file is committed to git.
gemini.api.key=${GEMINI_API_KEY}